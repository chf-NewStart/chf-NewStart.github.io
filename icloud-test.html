<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Phloem iCloud sign-in test</title>
<style>
  body{font:16px/1.5 -apple-system,system-ui,sans-serif;max-width:640px;margin:32px auto;padding:0 16px;background:#faf8f3;color:#222}
  input{width:100%;font:inherit;padding:8px;box-sizing:border-box}
  button{font:inherit;padding:8px 16px;margin:8px 0}
  #log{white-space:pre-wrap;background:#fff;border:1px solid #ddd;padding:12px;font:13px/1.4 ui-monospace,monospace;min-height:120px}
  .ok{color:#17803d;font-weight:600}.bad{color:#b42318;font-weight:600}
</style>
</head>
<body>
<h1>iCloud sign-in test</h1>
<p>This uses Apple's own pop-up sign-in, with nothing from Phloem in the way. Open it on a computer (Safari or Chrome), not on an iPhone or iPad.</p>
<p><label>CloudKit API token (the Post Message one)<br><input id="token" autocomplete="off" spellcheck="false"></label></p>
<button id="start">Start</button>
<div id="apple-sign-in-button"></div>
<div id="apple-sign-out-button"></div>
<p id="result"></p>
<div id="log"></div>
<script>
(function(){
  var log=document.getElementById('log'),result=document.getElementById('result');
  function say(line){log.textContent+=new Date().toISOString().slice(11,19)+'  '+line+'\n';}
  function done(ok,text){result.className=ok?'ok':'bad';result.textContent=text;say((ok?'PASS ':'FAIL ')+text);}
  function describe(error){if(!error)return'unknown error';return[error.ckErrorCode,error.serverErrorCode,error.reason,error.message].filter(Boolean).join(' · ');}
  try{var saved=new URLSearchParams(location.search).get('token');if(saved)document.getElementById('token').value=saved;}catch(e){}
  document.getElementById('start').onclick=function(){
    var token=document.getElementById('token').value.trim();
    if(!token){say('Paste the API token first.');return;}
    this.disabled=true;say('Loading Apple’s CloudKit script…');
    var script=document.createElement('script');script.src='https://cdn.apple-cloudkit.com/ck/2/cloudkit.js';
    script.onerror=function(){done(false,'Could not load Apple’s CloudKit script.');};
    script.onload=function(){
      try{
        CloudKit.configure({containers:[{containerIdentifier:'iCloud.com.houfu72.phloem',environment:'production',apiTokenAuth:{apiToken:token,persist:false}}]});
      }catch(error){done(false,'Configure failed: '+describe(error));return;}
      var container=CloudKit.getDefaultContainer();
      say('Asking Apple whether you are signed in…');
      container.setUpAuth().then(function(identity){
        if(identity){say('Already signed in.');return identity;}
        say('Not signed in yet. Click Apple’s “Sign in with Apple ID” button above, finish signing in, and let the pop-up close.');
        return container.whenUserSignsIn();
      }).then(function(identity){
        say('Apple accepted the sign-in (user '+String(identity&&identity.userRecordName||'?').slice(0,8)+'…).');
        say('Reading the private iCloud library…');
        return container.privateCloudDatabase.fetchRecords(['library-v1']).then(function(response){
          var record=(response.records||[])[0];
          if(response.hasErrors&&response.errors[0]&&response.errors[0].ckErrorCode!=='NOT_FOUND')throw response.errors[0];
          if(record&&record.serverErrorCode&&record.serverErrorCode!=='NOT_FOUND')throw record;
          done(true,record&&record.fields?'Signed in, and your iCloud library is readable from the website.':'Signed in. No library record yet, but iCloud answered.');
        });
      }).catch(function(error){done(false,describe(error));});
    };
    document.head.appendChild(script);
  };
})();
</script>
</body>
</html>
