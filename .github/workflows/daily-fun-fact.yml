name: Daily fun fact

on:
  schedule:
    # 05:00 UTC = 1:00 am Toronto during daylight saving (EDT).
    # When DST ends it fires at midnight local; adjust to '0 6 * * *' if
    # the 1 am wall-clock time matters in winter.
    - cron: '0 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

jobs:
  add-fact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add the next fact from the queue
        id: add
        run: node scripts/add-daily-fact.js

      - name: Commit and push to main
        env:
          TITLE: ${{ steps.add.outputs.title }}
        run: |
          if git diff --quiet; then
            echo "Queue empty — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tomato-facts.js fun-facts-queue.json
          git commit -m "Daily fun fact: ${TITLE:-new fact}"
          git push origin main

      - name: Nudge GitHub Pages to rebuild
        if: success()
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
